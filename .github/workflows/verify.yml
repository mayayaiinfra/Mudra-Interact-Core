name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mudra-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python-version: '3.11'}
          - {os: ubuntu-24.04, python-version: '3.12'}
          - {os: ubuntu-24.04, python-version: '3.13'}
          - {os: ubuntu-24.04, python-version: '3.14'}
          - {os: windows-2025, python-version: '3.11'}
          - {os: windows-2025, python-version: '3.12'}
          - {os: windows-2025, python-version: '3.13'}
          - {os: windows-2025, python-version: '3.14'}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Create isolated verifier environment
        if: runner.os != 'Windows'
        shell: bash
        run: python -m venv "$RUNNER_TEMP/mudra-verifier"
      - name: Create isolated verifier environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m venv (Join-Path $env:RUNNER_TEMP 'mudra-verifier')
      - name: Install and validate locked verification tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$RUNNER_TEMP/mudra-verifier/bin/python" -m pip install --require-hashes --no-deps -r requirements-dev.lock
          PIP_NO_INDEX=1 "$RUNNER_TEMP/mudra-verifier/bin/python" -m pip install --no-deps --no-build-isolation .
          PIP_NO_INDEX=1 "$RUNNER_TEMP/mudra-verifier/bin/python" -m pip check
      - name: Install and validate locked verification tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'mudra-verifier/Scripts/python.exe'
          & $python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw 'locked verifier install failed' }
          $env:PIP_NO_INDEX = '1'
          & $python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { throw 'offline package install into verifier failed' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'locked verifier dependency check failed' }
      - name: Block outbound networking for the Python process
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:RUNNER_TEMP 'mudra-verifier/Scripts/python.exe'
          $identityScript = "import ctypes,sys; buffer=ctypes.create_unicode_buffer(32768); length=ctypes.windll.kernel32.GetModuleFileNameW(None,buffer,len(buffer)); sys.exit(1) if length == 0 or length >= len(buffer) else None; print(sys.executable); print(buffer.value)"
          $identity = @(& $python -c $identityScript)
          if ($LASTEXITCODE -ne 0 -or $identity.Count -ne 2) { throw 'Unable to resolve verifier process identity' }
          $verifierPath = [IO.Path]::GetFullPath($python)
          $runningInterpreter = [IO.Path]::GetFullPath([string]$identity[0])
          $target = [IO.Path]::GetFullPath([string]$identity[1])
          if ($runningInterpreter -ine $verifierPath) { throw 'Acceptance interpreter is outside the isolated verifier environment' }
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw 'Windows process image path is unavailable' }
          $probe = "import socket,sys; s=socket.socket(socket.AF_INET,socket.SOCK_STREAM); s.settimeout(3); code=s.connect_ex(('1.1.1.1',443)); s.close(); sys.exit(code)"
          & $python -c $probe
          if ($LASTEXITCODE -ne 0) { throw 'Pre-block outbound connectivity control failed' }
          "MUDRA_WINDOWS_EGRESS_CONTROL=VERIFIED" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $name = "Mudra-MI08-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          "MUDRA_FIREWALL_RULE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUDRA_PYTHON_EXE=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-NetFirewallRule -Name $name -DisplayName $name -Direction Outbound -Action Block -Program $target -RemoteAddress Any -Profile Any -Enabled True | Out-Null
          $rule = Get-NetFirewallRule -PolicyStore ActiveStore -Name $name -ErrorAction Stop
          $application = Get-NetFirewallApplicationFilter -AssociatedNetFirewallRule $rule
          $address = Get-NetFirewallAddressFilter -AssociatedNetFirewallRule $rule
          $remote = @($address.RemoteAddress)
          $expectedTarget = [IO.Path]::GetFullPath($target)
          $actualTarget = [IO.Path]::GetFullPath($application.Program)
          if ($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block' -or $rule.Direction -ne 'Outbound' -or $rule.Profile -ne 'Any' -or $actualTarget -ine $expectedTarget -or $remote.Count -ne 1 -or $remote[0] -ne 'Any') { throw 'Process-image-scoped outbound block rule did not match its required configuration' }
      - name: Run acceptance suite in an isolated network context
        if: runner.os != 'Windows'
        shell: bash
        env:
          PIP_NO_INDEX: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          case "$RUNNER_OS" in
            Linux)
              runner_user="$USER"
              python_path="$RUNNER_TEMP/mudra-verifier/bin/python"
              runuser_path="$(command -v runuser)"
              sudo unshare --net -- "$runuser_path" -u "$runner_user" -- env PIP_NO_INDEX=1 PYTHONNOUSERSITE=1 "$python_path" tools/verify_gate.py --item MI-08 --report evidence/local/MI-08-ci.json
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 2
              ;;
          esac
      - name: Run acceptance suite with Windows firewall isolation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PIP_NO_INDEX: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'mudra-verifier/Scripts/python.exe'
          & $python tools/verify_gate.py --item MI-08 --report evidence/local/MI-08-ci.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record sanitized qualification receipt in the job log
        if: always()
        shell: bash
        run: |
          if [ ! -f evidence/local/MI-08-ci.json ]; then
            echo 'MUDRA_CI_RECEIPT_JSON=missing'
            exit 0
          fi
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          report_path = Path('evidence/local/MI-08-ci.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          print('MUDRA_CI_RECEIPT_JSON=' + json.dumps(report, ensure_ascii=False, separators=(',', ':'), sort_keys=True))
          recorded_paths = set()
          for artifact in report.get('artifacts', []):
              relative = Path(artifact['path'])
              data = relative.read_bytes()
              if hashlib.sha256(data).hexdigest() != artifact['sha256'] or len(data) != artifact['size_bytes']:
                  raise SystemExit('acceptance artifact digest mismatch')
              payload = {'path': relative.as_posix(), 'sha256': artifact['sha256'], 'data_base64': base64.b64encode(data).decode('ascii')}
              print('MUDRA_CI_ARTIFACT_BASE64_JSON=' + json.dumps(payload, ensure_ascii=False, separators=(',', ':'), sort_keys=True))
              recorded_paths.add(relative.as_posix())
          for command in report.get('commands', []):
              for argument in command.get('argv', []):
                  prefix = '--acceptance-report='
                  if not isinstance(argument, str) or not argument.startswith(prefix):
                      continue
                  relative = Path(argument[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('unsafe pytest report path')
                  if relative.as_posix() in recorded_paths or not relative.is_file():
                      continue
                  data = relative.read_bytes()
                  payload = {'path': relative.as_posix(), 'sha256': hashlib.sha256(data).hexdigest(), 'data_base64': base64.b64encode(data).decode('ascii')}
                  print('MUDRA_CI_ARTIFACT_BASE64_JSON=' + json.dumps(payload, ensure_ascii=False, separators=(',', ':'), sort_keys=True))
                  recorded_paths.add(relative.as_posix())
          PY
      - name: Remove temporary Windows firewall rule
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:MUDRA_FIREWALL_RULE_NAME) {
            Remove-NetFirewallRule -PolicyStore PersistentStore -Name $env:MUDRA_FIREWALL_RULE_NAME -ErrorAction SilentlyContinue
          }

  m3-gate:
    if: github.event_name == 'workflow_dispatch'
    name: M3 full acceptance gate / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and committed prerequisite evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.14'
      - name: Create isolated verifier environment
        shell: bash
        run: python -m venv "$RUNNER_TEMP/mudra-verifier"
      - name: Install and validate locked verification tools
        shell: bash
        run: |
          "$RUNNER_TEMP/mudra-verifier/bin/python" -m pip install --require-hashes --no-deps -r requirements-dev.lock
          PIP_NO_INDEX=1 "$RUNNER_TEMP/mudra-verifier/bin/python" -m pip install --no-deps --no-build-isolation .
          PIP_NO_INDEX=1 "$RUNNER_TEMP/mudra-verifier/bin/python" -m pip check
      - name: Run the complete M3 gate in an isolated network namespace
        shell: bash
        env:
          PIP_NO_INDEX: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          runner_user="$USER"
          python_path="$RUNNER_TEMP/mudra-verifier/bin/python"
          runuser_path="$(command -v runuser)"
          sudo unshare --net -- "$runuser_path" -u "$runner_user" -- env PIP_NO_INDEX=1 PYTHONNOUSERSITE=1 "$python_path" tools/verify_gate.py --gate M3 --report evidence/local/M3-ci.json
      - name: Record sanitized M3 gate report and acceptance artifacts
        if: always()
        shell: bash
        run: |
          if [ ! -f evidence/local/M3-ci.json ]; then
            echo 'MUDRA_M3_CI_REPORT_JSON=missing'
            exit 0
          fi
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          report_path = Path('evidence/local/M3-ci.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          print('MUDRA_M3_CI_REPORT_JSON=' + json.dumps(report, ensure_ascii=False, separators=(',', ':'), sort_keys=True))
          recorded_paths = set()
          for artifact in report.get('artifacts', []):
              relative = Path(artifact['path'])
              data = relative.read_bytes()
              if hashlib.sha256(data).hexdigest() != artifact['sha256'] or len(data) != artifact['size_bytes']:
                  raise SystemExit('M3 acceptance artifact digest mismatch')
              payload = {'path': relative.as_posix(), 'sha256': artifact['sha256'], 'data_base64': base64.b64encode(data).decode('ascii')}
              print('MUDRA_M3_CI_ARTIFACT_BASE64_JSON=' + json.dumps(payload, ensure_ascii=False, separators=(',', ':'), sort_keys=True))
              recorded_paths.add(relative.as_posix())
          for command in report.get('commands', []):
              for argument in command.get('argv', []):
                  prefix = '--acceptance-report='
                  if not isinstance(argument, str) or not argument.startswith(prefix):
                      continue
                  relative = Path(argument[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('unsafe M3 pytest report path')
                  if relative.as_posix() in recorded_paths or not relative.is_file():
                      continue
                  data = relative.read_bytes()
                  payload = {'path': relative.as_posix(), 'sha256': hashlib.sha256(data).hexdigest(), 'data_base64': base64.b64encode(data).decode('ascii')}
                  print('MUDRA_M3_CI_ARTIFACT_BASE64_JSON=' + json.dumps(payload, ensure_ascii=False, separators=(',', ':'), sort_keys=True))
                  recorded_paths.add(relative.as_posix())
          PY
