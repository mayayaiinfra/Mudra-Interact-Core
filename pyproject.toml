[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mudra-interact"
version = "0.2.0"
description = "Apache-2.0 landmark protocol and conservative Mudra interaction recognizer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "MAYAYAI"}]
keywords = ["gesture", "mudra", "landmarks", "human-agent-interaction", "privacy"]

[project.urls]
Documentation = "https://github.com/mayayaiinfra/Mudra-Interact-Core/blob/v0.2.0/docs/API.md"
Changelog = "https://github.com/mayayaiinfra/Mudra-Interact-Core/blob/v0.2.0/CHANGELOG.md"
Issues = "https://github.com/mayayaiinfra/Mudra-Interact-Core/issues"
Repository = "https://github.com/mayayaiinfra/Mudra-Interact-Core"

[project.scripts]
mudra-interact = "mudra_interact_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.data-files]
"" = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mudra_interact_core = ["catalog/*.json", "schemas/v2/*.json", "schemas/language/v1/*.json", "py.typed"]

[tool.pytest.ini_options]
markers = ["acceptance(case_id): required Mudra contract or verification case"]
pythonpath = ["src"]
